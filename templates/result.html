<!DOCTYPE html>

<html>
    <head>
        <title>Lorem Ipsum Generated Text</title>
    </head>
    
    <body>
        <h1>Lorem Ipsum Generator</h1>
        <p>Here is your generated text.</p>
        <!-- Super funny thing: textarea treats the indents in between the tags as text. -->
        <textarea rows="15" cols="80" readonly>{{ text }}</textarea>
        <p><strong>Generated {{ amount }} {{ unit }}(s) of text.</strong></p>
    </body>
</html>
